# API and model tests for the Django backend. Run from this directory:
#
#     ./venv/bin/pytest
#
# Django creates a throwaway `test_studyflow` database on the same Postgres
# server (the app role was granted CREATEDB for this), so tests exercise the
# real engine — including the DISTINCT ON path in CardReview.latest_per_card.
# --reuse-db keeps that database between runs; pass --create-db after a
# migration change.
#
# The pure-function suite in ../tests is separate on purpose: it needs no
# Django and runs under the repo-root .venv with `.venv/bin/pytest`.
[pytest]
DJANGO_SETTINGS_MODULE = studyplatform.settings
testpaths = tests
python_files = test_*.py
addopts = --reuse-db -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
